<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportation Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
  <div class="top-bar-container">
    
    <!-- Left Section: Logo & Guarantee Banner -->
    <div class="top-bar-left">
      <a href="#" class="brand-logo">
        <svg class="bus-icon" viewBox="0 0 24 24" width="28" height="28">
          <rect x="3" y="4" width="18" height="13" rx="3" fill="#ffd100"/>
          <path d="M6 17v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2h6v2a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2" fill="#ffd100"/>
          <rect x="5" y="7" width="6" height="4" rx="1" fill="#0066cc"/>
          <rect x="13" y="7" width="6" height="4" rx="1" fill="#0066cc"/>
          <circle cx="7" cy="14" r="1.5" fill="#333"/>
          <circle cx="17" cy="14" r="1.5" fill="#333"/>
        </svg>
        <span class="logo-text">Find Bus</span>
      </a>

      <!-- <div class="guarantee-badge">
        <span>Guarantee 150% refund if transport service is not provided (*)</span>
        <button class="info-btn" id="infoBtn" aria-label="More Information">ⓘ</button>
      </div> -->
    </div>

    <!-- Right Section: Navigation Links & Actions -->
    <div class="top-bar-right">
      <nav class="nav-links">
        <a href="#">My orders</a>
        <a href="#">Sell tickets on Vexere</a>
        <div class="dropdown">
          <button class="dropdown-btn">Become a Partner <span class="arrow">▼</span></button>
          <div class="dropdown-menu">
            <a href="#">Bus Operator</a>
            <a href="#">Agent</a>
          </div>
        </div>
      </nav>

      <div class="utility-actions">
        <!-- Country/Language Flag -->
        <button class="flag-btn" title="Language: Myanmar">
          <svg viewBox="0 0 30 20" width="24" height="16">
            <rect width="30" height="20" fill="#da251d"/>
            <polygon points="15,4 16.5,8.5 21,8.5 17.5,11 19,15.5 15,13 11,15.5 12.5,11 9,8.5 13.5,8.5" fill="#ffff00"/>
          </svg>
        </button>

        <!-- Help Icon -->
        <button class="icon-btn" title="Help">?</button>

        <!-- Hotline Button -->
        <a href="tel:1900888684" class="btn btn-outline">
          <span class="phone-icon">📞</span> Hotline 24/7
        </a>

        <!-- Log In Button -->
        <button class="btn btn-solid" id="loginBtn">Log in</button>
      </div>
    </div>

    <section class="banner" id="banner">
      <div class="slide active" style="background: url(images/Bagan.jpg);">Bagan</div>
    </section>

    </div>
  </header>

</body>
</html>
